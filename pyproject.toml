[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streampulse"
version = "0.1.0"
description = "Leakage-safe river water-temperature forecasting and thermal-watch alerts (OneAquaHealth hackathon)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
plots = ["matplotlib>=3.7"]

[project.scripts]
streampulse = "streampulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
