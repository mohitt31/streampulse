name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]" scikit-learn
      - run: pytest -q
      - name: synthetic end-to-end smoke
        run: |
          streampulse synth --root /tmp/sp
          streampulse all --root /tmp/sp
